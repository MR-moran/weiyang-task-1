<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>组队名片生成器</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #1f2937;
  }

  /* 顶部 */
  header {
    text-align: center;
    padding: 28px 16px 12px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 24px;
  }
  header p {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
  }

  /* 布局 */
  .layout {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* 卡片容器 */
  .panel {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }

  /* 表单 */
  .field { margin-bottom: 18px; }
  .field > label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #374151;
  }
  .field input[type="text"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .field input[type="text"]:focus {
    border-color: #4f46e5;
  }

  /* 已选标签 */
  .selected-box {
    min-height: 30px;
    margin-bottom: 8px;
  }
  .selected-box .empty {
    color: #9ca3af;
    font-size: 13px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #eef2ff;
    color: #4f46e5;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
    margin: 4px 6px 0 0;
  }
  .tag-remove {
    border: none;
    background: transparent;
    color: #4f46e5;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
  }

  /* 预设按钮 */
  .preset-box { display: flex; flex-wrap: wrap; }
  .preset {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    margin: 6px 8px 0 0;
    transition: all .15s;
  }
  .preset:hover {
    border-color: #4f46e5;
    color: #4f46e5;
  }
  .preset.active {
    background: #4f46e5;
    border-color: #4f46e5;
    color: #fff;
  }

  /* 主题色 */
  .theme-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .theme-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: transform .15s, border-color .15s;
  }
  .theme-dot:hover { transform: scale(1.08); }
  .theme-dot.active { border-color: #111827; }

  /* 操作按钮 */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-ghost { background: #f3f4f6; color: #374151; }

  /* 预览区 */
  .preview-panel {
    position: sticky;
    top: 16px;
  }
  .card-wrap {
    display: flex;
    justify-content: center;
    padding: 8px 0 18px;
  }

  /* 名片 */
  .namecard {
    width: 340px;
    border-radius: 18px;
    padding: 24px;
    color: #fff;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 12px 30px rgba(79,70,229,.28);
    transition: background .25s;
  }
  .card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,.22);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .card-name {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.2;
  }
  .card-intro {
    font-size: 13px;
    opacity: .9;
    margin-top: 3px;
  }

  .card-block { margin-top: 14px; }
  .card-block-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    opacity: .75;
    margin-bottom: 6px;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .card-tag {
    background: rgba(255,255,255,.2);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
  }
  .card-text {
    font-size: 13px;
    line-height: 1.5;
    opacity: .95;
    word-break: break-all;
  }
  .card-footer {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,.25);
    font-size: 11px;
    opacity: .75;
  }

  /* toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%) translateY(20px);
    background: #111827;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
	.avatar-row {
	  display: flex;
	  align-items: center;
	  gap: 14px;
	  margin-bottom: 10px;
	}
	.avatar-preview {
	  width: 56px;
	  height: 56px;
	  border-radius: 50%;
	  background: #f3f4f6;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  font-size: 28px;
	  overflow: hidden;
	  flex-shrink: 0;
	}
	.avatar-preview img {
	  width: 100%;
	  height: 100%;
	  object-fit: cover;
	}

	.emoji-box {
	  display: flex;
	  flex-wrap: wrap;
	  gap: 6px;
	}
	.emoji-item {
	  width: 34px;
	  height: 34px;
	  border-radius: 8px;
	  border: 1px solid #e5e7eb;
	  background: #fff;
	  font-size: 18px;
	  cursor: pointer;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  transition: all .15s;
	}
	.emoji-item:hover { border-color: #4f46e5; }
	.emoji-item.active {
	  border-color: #4f46e5;
	  background: #eef2ff;
	}
	.avatar img {
	  width: 100%;
	  height: 100%;
	  object-fit: cover;
	  border-radius: 50%;
	}
</style>
</head>
<body>

<header>
  <h1>  组队名片生成器</h1>
  <p>填写技能和兴趣，一键生成你的黑客松组队卡片</p>
</header>

<div class="layout">

  <!-- 左侧表单 -->
  <div class="panel">
	<div class="field">
	  <label>头像</label>

	  <!-- 预览 + 上传 -->
	  <div class="avatar-row">
		<div class="avatar-preview" id="avatarPreview">😊</div>
		<div>
		  <button class="btn btn-ghost" id="uploadBtn">上传图片</button>
		  <input type="file" id="avatarFile" accept="image/*" hidden />
		</div>
	  </div>

	  <!-- emoji 选择 -->
	  <div class="emoji-box" id="emojiBox"></div>
	</div>
    <div class="field">
      <label>昵称</label>
      <input type="text" id="name" placeholder="示例：小明" />
    </div>

    <div class="field">
      <label>一句话介绍</label>
      <input type="text" id="intro" placeholder="示例：擅长前端，想做好玩的产品" />
    </div>

    <div class="field">
      <label>技能</label>
      <div class="selected-box" id="skillSelected"></div>
      <div class="preset-box" id="skillPresets"></div>
    </div>

    <div class="field">
      <label>兴趣</label>
      <div class="selected-box" id="interestSelected"></div>
      <div class="preset-box" id="interestPresets"></div>
    </div>

    <div class="field">
      <label>想找的队友</label>
      <input type="text" id="teammate" placeholder="示例：想找一个XX和一位XX" />
    </div>

    <div class="field">
      <label>联系方式</label>
      <input type="text" id="contact" placeholder="示例：微信 xiaoming123" />
    </div>

    <div class="field">
      <label>主题色</label>
      <div class="theme-row" id="themeRow"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="downloadBtn">下载图片</button>
      <button class="btn btn-ghost" id="copyBtn">复制文案</button>
      <button class="btn btn-ghost" id="resetBtn">重置</button>
    </div>
  </div>

  <!-- 右侧预览 -->
  <div class="panel preview-panel">
    <div class="card-wrap">
      <div class="namecard" id="namecard">
        <div class="card-header">
          <div class="avatar" id="cardAvatar"></div>
          <div>
            <div class="card-name" id="cardName">你的昵称</div>
            <div class="card-intro" id="cardIntro">一句话介绍</div>
          </div>
        </div>

        <div class="card-block">
          <div class="card-block-title">技能</div>
          <div class="card-tags" id="cardSkills">
            <span class="card-tag">前端</span>
          </div>
        </div>

        <div class="card-block">
          <div class="card-block-title">兴趣</div>
          <div class="card-tags" id="cardInterests">
            <span class="card-tag">AI</span>
          </div>
        </div>

        <div class="card-block">
          <div class="card-block-title">想找的队友</div>
          <div class="card-text" id="cardTeammate">—</div>
        </div>

        <div class="card-block">
          <div class="card-block-title">联系方式</div>
          <div class="card-text" id="cardContact">—</div>
        </div>

        <div class="card-footer"># 黑客松组队名片</div>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 头像 ============ */
let avatar = {
  type: "emoji",   // "emoji" 或 "image"
  value: "😊",     // emoji 字符 或 图片的 dataURL
};
const emojis = ["😊","💻","🌟","🐱","🐼","🦊","🎮","😋"];
const emojiBox = document.getElementById("emojiBox");
const avatarPreview = document.getElementById("avatarPreview");

function renderEmojis() {
  emojiBox.innerHTML = "";
  emojis.forEach(e => {
    const btn = document.createElement("button");
    const active = avatar.type === "emoji" && avatar.value === e;
    btn.className = active ? "emoji-item active" : "emoji-item";
    btn.textContent = e;
    btn.onclick = () => {
      avatar = { type: "emoji", value: e };
      renderAll();
    };
    emojiBox.appendChild(btn);
  });
}
/* ============上传头像 ===========*/
const uploadBtn = document.getElementById("uploadBtn");
const avatarFile = document.getElementById("avatarFile");

uploadBtn.onclick = () => avatarFile.click();

avatarFile.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    showToast("请选择图片文件");
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    showToast("图片不要超过 2MB");
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    avatar = { type: "image", value: reader.result };
    renderAll();
  };
  reader.readAsDataURL(file);

  // 允许重复选同一张
  avatarFile.value = "";
};
/* ========= 渲染头像预览 ==========*/
function renderAvatarPreview() {
  avatarPreview.innerHTML = "";
  if (avatar.type === "image") {
    const img = document.createElement("img");
    img.src = avatar.value;
    avatarPreview.appendChild(img);
  } else {
    avatarPreview.textContent = avatar.value;
  }
}

const cardAvatar = document.getElementById("cardAvatar");

function renderCardAvatar() {
  cardAvatar.innerHTML = "";
  if (avatar.type === "image") {
    const img = document.createElement("img");
    img.src = avatar.value;
    cardAvatar.appendChild(img);
  } else {
    cardAvatar.textContent = avatar.value;
  }
}
/* ============ 数据 ============ */
const skillPresets = ["前端","后端","UI设计","产品","算法","硬件","数据分析","运营","文案","剪辑"];
const interestPresets = ["AI","游戏","社交","音乐","运动","设计","分析"];

const themes = [
  { name: "indigo", bg: "linear-gradient(135deg, #4f46e5, #7c3aed)" },
  { name: "blue",   bg: "linear-gradient(135deg, #2563eb, #06b6d4)" },
  { name: "orange", bg: "linear-gradient(135deg, #f97316, #ef4444)" },
  { name: "green",  bg: "linear-gradient(135deg, #059669, #10b981)" },
  { name: "dark",   bg: "linear-gradient(135deg, #1f2937, #374151)" },
  { name: "white",  bg: "linear-gradient(135deg, #CED4DA, #D0D0D0)" },
];

let selectedSkills = [];
let selectedInterests = [];
let currentTheme = themes[0];

/* ============ DOM ============ */
const nameInput = document.getElementById("name");
const introInput = document.getElementById("intro");
const teammateInput = document.getElementById("teammate");
const contactInput = document.getElementById("contact");

const skillSelectedBox = document.getElementById("skillSelected");
const skillPresetBox = document.getElementById("skillPresets");
const interestSelectedBox = document.getElementById("interestSelected");
const interestPresetBox = document.getElementById("interestPresets");
const themeRow = document.getElementById("themeRow");

const card = document.getElementById("namecard");
const cardName = document.getElementById("cardName");
const cardIntro = document.getElementById("cardIntro");
const cardSkills = document.getElementById("cardSkills");
const cardInterests = document.getElementById("cardInterests");
const cardTeammate = document.getElementById("cardTeammate");
const cardContact = document.getElementById("cardContact");

const toast = document.getElementById("toast");

/* ============ 标签逻辑 ============ */
function toggleTag(list, tag) {
  const idx = list.indexOf(tag);
  if (idx >= 0) list.splice(idx, 1);
  else {
    if (list.length >= 4) {
      showToast("最多选 4 个");
      return;
    }
    list.push(tag);
  }
  renderAll();
}

function removeTag(list, tag) {
  const idx = list.indexOf(tag);
  if (idx >= 0) list.splice(idx, 1);
  renderAll();
}

function renderSelected(box, list, targetList) {
  box.innerHTML = "";
  if (list.length === 0) {
    const empty = document.createElement("span");
    empty.className = "empty";
    empty.textContent = "暂未选择";
    box.appendChild(empty);
    return;
  }
  list.forEach(tag => {
    const el = document.createElement("span");
    el.className = "tag";
    el.innerHTML = `${tag} <button class="tag-remove">×</button>`;
    el.querySelector(".tag-remove").onclick = () => removeTag(targetList, tag);
    box.appendChild(el);
  });
}

function renderPresets(box, presets, selectedList, targetList) {
  box.innerHTML = "";
  presets.forEach(tag => {
    const btn = document.createElement("button");
    btn.className = selectedList.includes(tag) ? "preset active" : "preset";
    btn.textContent = tag;
    btn.onclick = () => toggleTag(targetList, tag);
    box.appendChild(btn);
  });
}

/* ============ 主题色 ============ */
function renderThemes() {
  themeRow.innerHTML = "";
  themes.forEach(t => {
    const dot = document.createElement("div");
    dot.className = "theme-dot" + (t.name === currentTheme.name ? " active" : "");
    dot.style.background = t.bg;
    dot.onclick = () => {
      currentTheme = t;
      renderAll();
    };
    themeRow.appendChild(dot);
  });
}

/* ============ 名片渲染 ============ */
function renderCard() {
  cardName.textContent = nameInput.value.trim() || "你的昵称";
  cardIntro.textContent = introInput.value.trim() || "一句话介绍";
  cardTeammate.textContent = teammateInput.value.trim() || "—";
  cardContact.textContent = contactInput.value.trim() || "—";
  card.style.background = currentTheme.bg;

  cardSkills.innerHTML = "";
  if (selectedSkills.length === 0) {
    cardSkills.innerHTML = '<span class="card-tag">技能待添加</span>';
  } else {
    selectedSkills.forEach(s => {
      const el = document.createElement("span");
      el.className = "card-tag";
      el.textContent = s;
      cardSkills.appendChild(el);
    });
  }

  cardInterests.innerHTML = "";
  if (selectedInterests.length === 0) {
    cardInterests.innerHTML = '<span class="card-tag">兴趣待添加</span>';
  } else {
    selectedInterests.forEach(s => {
      const el = document.createElement("span");
      el.className = "card-tag";
      el.textContent = s;
      cardInterests.appendChild(el);
    });
  }
  renderCardAvatar()
}

/* ============ 统一渲染 ============ */
function renderAll() {
  renderSelected(skillSelectedBox, selectedSkills, selectedSkills);
  renderPresets(skillPresetBox, skillPresets, selectedSkills, selectedSkills);

  renderSelected(interestSelectedBox, selectedInterests, selectedInterests);
  renderPresets(interestPresetBox, interestPresets, selectedInterests, selectedInterests);

  renderThemes();
  renderCard();
  renderEmojis();
  renderAvatarPreview();
}

/* ============ 输入联动 ============ */
[nameInput, introInput, teammateInput, contactInput].forEach(input => {
  input.addEventListener("input", renderCard);
});

/* ============ Toast ============ */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
}

/* ============ 下载图片 ============ */
document.getElementById("downloadBtn").onclick = () => {
  html2canvas(card, { backgroundColor: null, scale: 2 }).then(canvas => {
    const link = document.createElement("a");
    link.download = `组队名片-${nameInput.value.trim() || "未命名"}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("图片已保存");
  }).catch(() => {
    showToast("生成图片失败，请重试");
  });
};

/* ============ 复制文案 ============ */
document.getElementById("copyBtn").onclick = () => {
  const lines = [
    `【组队名片】昵称：${nameInput.value.trim() || "你的昵称"} 一句话介绍：`,
    introInput.value.trim(),
    "",
    `技能：${selectedSkills.join("、") || "—"}`,
    `兴趣：${selectedInterests.join("、") || "—"}`,
    `想找的队友：${teammateInput.value.trim() || "—"}`,
    `联系方式：${contactInput.value.trim() || "—"}`,
  ];
  const text = lines.filter(Boolean).join("\n");
  navigator.clipboard.writeText(text).then(() => {
    showToast("文案已复制");
  }).catch(() => {
    showToast("复制失败，请手动复制");
  });
};

/* ============ 重置 ============ */
document.getElementById("resetBtn").onclick = () => {
  nameInput.value = "";
  introInput.value = "";
  teammateInput.value = "";
  contactInput.value = "";
  selectedSkills = [];
  selectedInterests = [];
  currentTheme = themes[0];
  avatar = { type: "emoji", value: "😊" };
  renderAll();
  showToast("已重置");
};

/* ============ 初始化 ============ */
renderAll();
</script>
</body>
</html>
